# 独立的桌面工具发行目录。这里只提供公开安装文件，不存用户项目或凭据。
location = /desktop-downloads/updates/latest.yml {
    alias /opt/miaoimg/desktop-downloads/updates/latest.yml;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires -1;
}
location = /desktop-downloads/updates/latest-mac.yml {
    alias /opt/miaoimg/desktop-downloads/updates/latest-mac.yml;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    expires -1;
}
location ^~ /desktop-downloads/ {
    alias /opt/miaoimg/desktop-downloads/;
    autoindex off;
    gzip off;
    add_header X-Content-Type-Options nosniff always;
    expires 30d;
    access_log off;
}
