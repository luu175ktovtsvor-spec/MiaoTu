location = /manage { alias /opt/miaoimg/current/admin-web/admin.html; default_type text/html; add_header Cache-Control no-store always; }
location = /manage/ { alias /opt/miaoimg/current/admin-web/admin.html; default_type text/html; add_header Cache-Control no-store always; }
location /admin-assets/ { alias /opt/miaoimg/current/admin-web/; }
location /admin-api/ {
    proxy_pass http://127.0.0.1:4184/api/admin/;
    include /etc/nginx/miaoimg/proxy-common.conf;
}
location ^~ /api/admin {
    proxy_pass http://127.0.0.1:4184;
    include /etc/nginx/miaoimg/proxy-common.conf;
}
