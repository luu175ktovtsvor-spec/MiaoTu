# Public data only. Content publication never changes the desktop update feed.
location ^~ /library-content/ {
    proxy_pass http://127.0.0.1:4177;
    proxy_set_header Host 127.0.0.1:4177;
    proxy_read_timeout 45s;
}

# Missing video posters must never fall through to the website HTML shell.
location ~ "^/images/[0-9]{10,24}/video_[0-9]{1,2}[.]jpg$" {
    proxy_pass http://127.0.0.1:4177;
    proxy_set_header Host 127.0.0.1:4177;
    proxy_read_timeout 45s;
}
