server {
 listen 80;
 server_name miaoimg.cn www.miaoimg.cn canvas.miaoimg.cn admin.miaoimg.cn;
 location /.well-known/acme-challenge/ { root /var/www/certbot; }
 location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    #     listen 443 quic;
    #     listen [::]:443 quic;
    access_log /var/log/nginx/access.log;
    #     add_header Alt-Svc 'h3=":443"; ma=86400' always;
    server_name miaoimg.cn www.miaoimg.cn canvas.miaoimg.cn;
    server_tokens off;
    add_header X-Miaoimg-Server mainland always;
    client_max_body_size 100m;
    ssl_certificate /etc/miaoimg/tls/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/miaoimg/tls/privkey.pem; # managed by Certbot

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/json application/javascript application/xml image/svg+xml;

    open_file_cache max=5000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    location /previews/ {
        alias /opt/miaoimg/previews/;
        expires 30d;
        access_log off;
    }

    location /thumbs/ {
        alias /opt/miaoimg/images/;
        image_filter resize 640 -;
        image_filter_buffer 4M;
        image_filter_jpeg_quality 75;
        expires 30d;
        access_log off;
    }

    location /images/ {
        alias /opt/miaoimg/images/;
        error_page 404 = @miaoimg_archive_media;
        expires 30d;
        access_log off;
    }
    include /etc/nginx/snippets/miaoimg-archive-media.conf;

    location /assets/ {
        root /opt/miaoimg/site-assets;
        error_page 404 = @miaoimg_runtime_assets;
        expires 1y;
        access_log off;
    }
    location @miaoimg_runtime_assets {
        proxy_pass http://127.0.0.1:4173;
        proxy_set_header Host 127.0.0.1:4173;
    }

    include /etc/nginx/snippets/miaoimg-desktop-downloads.conf;
    include /etc/nginx/snippets/miaoimg-desktop-update-cache.conf;
    include /etc/nginx/snippets/miaoimg-admin-console.conf;
    include /etc/nginx/snippets/miaoimg-desktop-only-site.conf;
    include /etc/nginx/snippets/miaoimg-official-site-media.conf;
    include /etc/nginx/snippets/miaoimg-official-site-html.conf;

    # 本块由 scripts/nginx-api-routes.mjs 从 web/vite.config.ts 生成，别手改。
    location ^~ /api/imagine {
        # 直出开关：Node 只做鉴权，字节由 nginx 发；注释掉本行即回到 Node 直发。
        proxy_set_header X-Miaoimg-Media-Accel 1;
        proxy_request_buffering off;
        client_body_timeout 300s;
        # 直出时 nginx 会用静态模块的响应头替换 Node 的，revision 必须显式带出来，
        # 否则前端读不到修订号，后续保存会被判成过期（409）。空值不会发这个头。
        gzip off;
        proxy_pass http://127.0.0.1:4175;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:4175;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 管理 API 直接使用原生服务的回环端口。

    # 其余内层 API：/api/agent、/api/mcp、/api/nodes、/api/ext、/api/plugins、/api/ai、/api/ffmpeg、/mcp
    location ~ ^/(api/(agent|mcp|nodes|ext|plugins|ai|ffmpeg)(/|$)|mcp(/|$)) {
        gzip off;
        proxy_pass http://127.0.0.1:4175;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:4175;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 兜底：档案 API（/api）
    location /api/ {
        proxy_pass http://127.0.0.1:4176;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:4176;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:4176;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:4176;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1:4173;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 工作区媒体的真实字节由 nginx 从这里发出；internal 保证外部无法直接访问（该 URI 不含凭据）。
    location /__media_internal/ {
        internal;
        alias /opt/miaoimg/media/;
        # 工作区用原子 rename 更新字节，不能继承静态站点的旧文件描述符缓存。
        open_file_cache off;
        sendfile on;
        tcp_nopush on;
        # ETag 与 Node 已确认的 revision 保持一致，避免 mtime+size 碰撞。
        etag off;
        add_header ETag $upstream_http_etag always;
        add_header x-workspace-revision $upstream_http_x_workspace_revision always;
        add_header X-Content-Type-Options $upstream_http_x_content_type_options always;
        add_header Content-Security-Policy $upstream_http_content_security_policy always;
    }




}
server {
 listen 443 ssl http2;
 server_name admin.miaoimg.cn;
 ssl_certificate /etc/miaoimg/tls/fullchain.pem;
 ssl_certificate_key /etc/miaoimg/tls/privkey.pem;
 server_tokens off;
    add_header X-Miaoimg-Server mainland always;
 client_max_body_size 100m;
 include /etc/nginx/snippets/miaoimg-admin-console.conf;
 location = / { root /opt/miaoimg/current/admin-web; try_files /admin.html =404; add_header Cache-Control no-store always; }
 location = /miaoimg-logo.png { alias /opt/miaoimg/current/admin-web/miaoimg-logo.png; }
 location / { return 404; }
}
