# Inside the miaoimg server block, add to the existing /images/ location:
# error_page 404 = @miaoimg_archive_media;
# Local files remain served by nginx. Missing catalogued videos use the relay.
location @miaoimg_archive_media {
    proxy_pass http://127.0.0.1:4173;
    proxy_http_version 1.1;
    proxy_set_header Host 127.0.0.1:4173;
    proxy_set_header Range $http_range;
    proxy_buffering off;
    proxy_read_timeout 70s;
}
