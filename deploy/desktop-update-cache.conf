# Stable update metadata and download aliases must not retain old releases.
location = /desktop-downloads/updates/latest.yml {
    alias /opt/miaoimg/desktop-downloads/updates/latest.yml;
    gzip off;
    add_header Cache-Control "no-store, max-age=0" always;
    add_header X-Content-Type-Options nosniff always;
    access_log off;
}
