name: 妙图 macOS 打包

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/desktop-macos-package.yml
      - package.json
      - package-lock.json
      - scripts/compile-desktop.ts
      - scripts/desktop-resources.ts
      - scripts/third-party-notices.ts
      - docs/compatibility/**
      - LICENSE
      - desktop/**
      - server/**

permissions:
  contents: write

concurrency:
  group: desktop-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MIAO_DESKTOP_NO_GENERATION: '1'
      ENABLE_MODEL_CALLS: 'false'
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: 检查原生验收所需配置
        env:
          MIAO_ACCEPT_EMAIL: ${{ secrets.MIAO_ACCEPT_EMAIL }}
          MIAO_ACCEPT_PASSWORD: ${{ secrets.MIAO_ACCEPT_PASSWORD }}
        run: node --input-type=module -e "if (!process.env.MIAO_ACCEPT_EMAIL || !process.env.MIAO_ACCEPT_PASSWORD) throw new Error('Existing authorized acceptance credentials are required before packaging')"
      - name: 安装依赖
        run: |
          npm ci
          npm --prefix desktop/renderer ci
          npm --prefix desktop ci
      - name: 打包 macOS 两种架构
        run: npm --prefix desktop run package:mac
      - name: 实际启动匹配架构安装包并验收
        env:
          MIAO_ACCEPT_EMAIL: ${{ secrets.MIAO_ACCEPT_EMAIL }}
          MIAO_ACCEPT_PASSWORD: ${{ secrets.MIAO_ACCEPT_PASSWORD }}
        run: |
          if [ "$(uname -m)" = arm64 ]; then bundle=desktop/release/mac-arm64; else bundle=desktop/release/mac; fi
          node desktop/scripts/accept-login.ts "$bundle/妙图.app/Contents/MacOS/妙图" "$RUNNER_TEMP/desktop-proof"
      - name: 保存脱敏验收结果
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PROOF_TAG: desktop-mac-proof-${{ github.run_id }}
        run: |
          if [ -f "$RUNNER_TEMP/desktop-proof/result.json" ]; then
            gh release create "$PROOF_TAG" "$RUNNER_TEMP/desktop-proof/result.json" --target "$GITHUB_SHA" --latest=false --title "临时 macOS 验收 $GITHUB_SHA" --notes 'Sanitized temporary acceptance result; delete after retrieval.'
          fi
      - name: 保存安装包到临时 Release
        if: always() && hashFiles('desktop/release/latest-mac.yml') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: desktop-mac-build-${{ github.run_id }}
        run: |
          mkdir -p desktop/release/publish
          for path in desktop/release/妙图-*.dmg desktop/release/妙图-*.zip; do
            name=$(basename "$path")
            cp "$path" "desktop/release/publish/${name/妙图/MiaoImg}"
          done
          sed 's/妙图-/MiaoImg-/g' desktop/release/latest-mac.yml > desktop/release/publish/latest-mac.yml
          gh release create "$RELEASE_TAG" desktop/release/publish/* \
            --target "$GITHUB_SHA" --latest=false \
            --title "临时 macOS 构建 $GITHUB_SHA" \
            --notes "Temporary build assets; delete after retrieval."
