      (() => {
        const params = new URLSearchParams(window.location.search)
        const landing = window.location.hostname !== 'admin.miaoimg.cn' && !window.location.pathname.startsWith('/manage')
        if (!landing) return
        const lang = params.get('lang') === 'en' ? 'en' : 'zh'
        document.documentElement.dataset.landing = '1'
        document.documentElement.dataset.landingLang = lang
        document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en'
        // Only an explicit URL language overrides the persisted TS provider state.
        if (params.get('lang') === 'en' || params.get('lang') === 'zh') window.__OIP_INITIAL_LANG__ = lang
      })()
